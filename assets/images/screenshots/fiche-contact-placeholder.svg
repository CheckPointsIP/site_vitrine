<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F5F7"/>

  <!-- Bauhaus geometric shapes -->
  <rect x="100" y="100" width="100" height="100" fill="#667eea" opacity="0.15" transform="rotate(45 150 150)"/>
  <circle cx="1000" cy="200" r="120" fill="#FFAB00" opacity="0.15"/>
  <rect x="50" y="600" width="200" height="150" fill="#FF5630" opacity="0.15"/>

  <!-- Main content card -->
  <rect x="150" y="150" width="900" height="600" fill="#FFFFFF" rx="12" stroke="#172B4D" stroke-width="3"/>

  <!-- Header with avatar -->
  <rect x="150" y="150" width="900" height="80" fill="#172B4D" rx="12"/>
  <circle cx="220" cy="190" r="30" fill="#667eea"/>
  <text x="270" y="200" font-family="Inter, sans-serif" font-size="22" fill="#FFFFFF" font-weight="600">Fiche Contact Apprenti</text>

  <!-- Info sections -->
  <rect x="200" y="270" width="800" height="60" fill="#F4F5F7" rx="6"/>
  <text x="220" y="295" font-family="Inter, sans-serif" font-size="14" fill="#172B4D" font-weight="600">INFORMATIONS PERSONNELLES</text>
  <text x="220" y="315" font-family="Inter, sans-serif" font-size="13" fill="#172B4D" opacity="0.7">Nom, prénom, coordonnées, entreprise...</text>

  <rect x="200" y="350" width="800" height="60" fill="#F4F5F7" rx="6"/>
  <text x="220" y="375" font-family="Inter, sans-serif" font-size="14" fill="#172B4D" font-weight="600">HISTORIQUE D'INTERACTIONS</text>
  <text x="220" y="395" font-family="Inter, sans-serif" font-size="13" fill="#172B4D" opacity="0.7">Appels, emails, SMS, rendez-vous...</text>

  <rect x="200" y="430" width="800" height="60" fill="#F4F5F7" rx="6"/>
  <text x="220" y="455" font-family="Inter, sans-serif" font-size="14" fill="#172B4D" font-weight="600">DOCUMENTS LIÉS</text>
  <text x="220" y="475" font-family="Inter, sans-serif" font-size="13" fill="#172B4D" opacity="0.7">Contrats, certificats, évaluations...</text>

  <rect x="200" y="510" width="800" height="60" fill="#F4F5F7" rx="6"/>
  <text x="220" y="535" font-family="Inter, sans-serif" font-size="14" fill="#172B4D" font-weight="600">PARCOURS DE FORMATION</text>
  <text x="220" y="555" font-family="Inter, sans-serif" font-size="13" fill="#172B4D" opacity="0.7">Modules, compétences, progression...</text>

  <!-- Action buttons -->
  <rect x="200" y="600" width="180" height="45" fill="#667eea" rx="8"/>
  <text x="290" y="628" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">Modifier</text>

  <rect x="400" y="600" width="180" height="45" fill="#FF5630" rx="8"/>
  <text x="490" y="628" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">Envoyer SMS</text>

  <rect x="600" y="600" width="180" height="45" fill="#FFAB00" rx="8"/>
  <text x="690" y="628" font-family="Inter, sans-serif" font-size="14" fill="#172B4D" text-anchor="middle" font-weight="600">Ajouter Note</text>

  <!-- Status indicator -->
  <circle cx="1000" cy="190" r="8" fill="#00C853"/>
  <text x="970" y="215" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF">Actif</text>

  <!-- Footer text -->
  <text x="600" y="780" font-family="Inter, sans-serif" font-size="14" fill="#667eea" text-anchor="middle" opacity="0.7">[Screenshot Placeholder - Fiche Contact Centralisée]</text>
</svg>